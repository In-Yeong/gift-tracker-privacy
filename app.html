<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<title>선물 내역</title>
<style>
/* 선물 내역 — 따뜻한 장부 느낌, 모바일 우선 */
:root {
  --bg: #f7f3ec;
  --surface: #fffdf8;
  --surface2: #fbf8f1;
  --ink: #3a352c;
  --ink-soft: #7c7466;
  --ink-faint: #a89e8d;
  --line: #e7ddcc;
  --line-soft: #efe8d8;
  --primary: #8a5a33;
  --primary-dark: #6f4625;
  --given: #b8452e;      /* 준 선물 */
  --given-bg: #f9e9e4;
  --received: #2f7d6d;   /* 받은 선물 */
  --received-bg: #e3f0ec;
  --danger: #d43d2a;
  --radius: 14px;
  --radius-sm: 10px;
  --tabbar-h: 64px;
  --shadow: 0 1px 3px rgba(90, 70, 45, .08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

/* ---------- 뷰 ---------- */
#views { padding: 18px 16px calc(var(--tabbar-h) + 96px); }
.view { display: none; }
.view.active { display: block; }
.view-head h1 { font-size: 22px; margin: 2px 0 14px; letter-spacing: -.3px; }
.view-sub { color: var(--ink-soft); margin: -8px 0 14px; font-size: 13px; }
.sec-title { font-size: 16px; margin: 22px 0 10px; }

/* ---------- 검색창 ---------- */
.searchbar {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 0 14px; min-height: 52px;
  color: var(--ink-faint); box-shadow: var(--shadow); margin-bottom: 12px;
}
.searchbar input {
  border: 0; outline: 0; background: transparent; flex: 1;
  font-size: 16px; color: var(--ink); min-height: 48px;
}

/* ---------- 세그먼트 ---------- */
.seg {
  display: flex; background: var(--surface2); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px; margin-bottom: 14px;
}
.seg button {
  flex: 1; border: 0; background: transparent; border-radius: 999px;
  min-height: 40px; font-size: 14px; font-weight: 600; color: var(--ink-soft);
  cursor: pointer;
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- 기록 하위 탭 ---------- */
#subTabs {
  display: flex; background: var(--surface2); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px; margin-bottom: 16px;
}
#subTabs[hidden] { display: none; }
#subTabs button {
  flex: 1; border: 0; background: transparent; border-radius: 999px;
  min-height: 38px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
  cursor: pointer; white-space: nowrap;
}
#subTabs button.on { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); font-weight: 700; }

/* ---------- 목록 헤드 / 텍스트 버튼 ---------- */
.list-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 10px; }
.list-title { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.text-btn {
  border: 0; background: transparent; color: var(--ink);
  font-size: 14px; font-weight: 600; padding: 12px 6px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 2px; min-height: 48px;
}
.text-btn .arrow { font-size: 11px; color: var(--ink-soft); }

/* ---------- 선물 카드 + 스와이프 ---------- */
.swipe-wrap { position: relative; margin-bottom: 10px; }
.swipe-del {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 60px; height: 60px; border-radius: 50%; border: 0;
  background: var(--danger); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(212, 61, 42, .35);
}
.swipe-inner { position: relative; touch-action: pan-y; will-change: transform; }
.gift-card {
  display: flex; gap: 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px; box-shadow: var(--shadow); cursor: pointer;
}
.gift-thumb {
  width: 64px; height: 64px; border-radius: var(--radius-sm); flex: none;
  background: var(--surface2); border: 1px solid var(--line-soft);
  object-fit: cover;
}
.gift-thumb.placeholder { display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 22px; }
.gift-info { flex: 1; min-width: 0; }
.gift-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.gift-meta { font-size: 13px; color: var(--ink-soft); }
.gift-price { font-weight: 700; font-size: 15px; margin-top: 4px; }
.chip {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px;
  border-radius: 999px; margin-right: 6px; vertical-align: 1px;
}
.chip.given { background: var(--given-bg); color: var(--given); }
.chip.received { background: var(--received-bg); color: var(--received); }
.month-head {
  font-size: 15px; font-weight: 800; margin: 20px 2px 10px; color: var(--ink);
  padding-top: 6px; border-top: 1px dashed var(--line);
}
.month-head:first-of-type { border-top: 0; margin-top: 4px; padding-top: 0; }
.more-wrap { text-align: center; margin: 16px 0 8px; }
.more-btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 0 26px; min-height: 48px; font-size: 14px; font-weight: 600;
  cursor: pointer;
}
.empty { text-align: center; color: var(--ink-faint); padding: 40px 0; font-size: 14px; }

/* ---------- 광고 자리 ---------- */
.ad-slot {
  border: 1px dashed var(--ink-faint); border-radius: var(--radius-sm);
  background: var(--surface2); color: var(--ink-faint);
  text-align: center; font-size: 12px; padding: 18px 0; margin: 10px 0;
  letter-spacing: 2px;
}

/* ---------- 하단 탭바 / FAB ---------- */
#tabbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
  width: 100%; max-width: 480px; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; z-index: 40;
}
#tabbar button {
  flex: 1; border: 0; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-faint); font-size: 11px; font-weight: 600; min-height: var(--tabbar-h);
}
#tabbar button svg { width: 24px; height: 24px; }
#tabbar button.on { color: var(--primary); }
#fab {
  position: fixed; right: max(18px, calc(50% - 240px + 18px));
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);
  width: 58px; height: 58px; border-radius: 50%; border: 0; z-index: 41;
  background: var(--primary); color: #fff; font-size: 30px; line-height: 1;
  box-shadow: 0 4px 14px rgba(138, 90, 51, .4); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ---------- 캘린더 ---------- */
.cal-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title { font-size: 17px; font-weight: 800; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.cal-dow { text-align: center; font-size: 12px; color: var(--ink-faint); font-weight: 700; padding: 6px 0; }
.cal-day {
  min-height: 52px; border: 0; background: transparent; border-radius: var(--radius-sm);
  font-size: 14px; color: var(--ink); cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.cal-day.dim { color: var(--ink-faint); opacity: .45; }
.cal-day.today { font-weight: 800; color: var(--primary); }
.cal-day.sel { background: var(--primary); color: #fff; }
.cal-day.sel .dot { background: #fff !important; }
.cal-dots { display: flex; gap: 3px; height: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.given { background: var(--given); }
.dot.received { background: var(--received); }
.cal-legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); margin: 10px 2px; }
.cal-legend .dot { margin-left: 10px; }
.cal-legend .dot:first-child { margin-left: 0; }
.cal-daylist { margin-top: 6px; }

/* ---------- 사람 ---------- */
.person-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px; cursor: pointer; text-align: left;
  font-size: 15px; color: var(--ink); box-shadow: var(--shadow); min-height: 64px;
}
.person-avatar {
  width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: var(--surface2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 17px; color: var(--primary);
}
.person-row .p-sub { font-size: 12px; color: var(--ink-soft); }
.person-detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.person-detail-head h2 { margin: 0; font-size: 19px; }
.back-btn { border: 0; background: transparent; font-size: 15px; color: var(--primary); font-weight: 700; cursor: pointer; padding: 12px 8px 12px 0; min-height: 48px; }
.subsec { font-size: 14px; font-weight: 800; margin: 20px 0 8px; color: var(--ink-soft); }
.idea-item, .reminder-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px; margin-bottom: 8px; font-size: 14px;
}
.idea-item span, .reminder-item .r-main { flex: 1; min-width: 0; }
.mini-btn {
  border: 1px solid var(--line); background: var(--surface2); border-radius: 8px;
  min-width: 48px; min-height: 40px; font-size: 13px; cursor: pointer; color: var(--ink);
  padding: 0 10px;
}
.mini-btn.danger { color: var(--danger); border-color: #eec4bd; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--ink-soft); }
.inline-add { display: flex; gap: 8px; margin-top: 8px; }
.inline-add input { flex: 1; }

/* ---------- 기념일 ---------- */
.anniv-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow);
}
.dday {
  flex: none; min-width: 64px; text-align: center;
  background: var(--primary); color: #fff; border-radius: var(--radius-sm);
  font-weight: 800; font-size: 15px; padding: 10px 6px;
}
.dday.soon { background: var(--danger); }
.anniv-info { flex: 1; min-width: 0; font-size: 14px; }
.anniv-info .a-name { font-weight: 700; font-size: 15px; }
.anniv-info .a-sub { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }

/* ---------- 통계 ---------- */
.stats-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
.stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 14px; box-shadow: var(--shadow); }
.stat-card .s-label { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.stat-card .s-amount { font-size: 19px; font-weight: 800; margin-top: 4px; }
.stat-card .s-count { font-size: 12px; color: var(--ink-faint); }
.stat-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 8px; font-size: 14px;
}
.stat-row .r-amount { font-weight: 800; }
.pstat { display: flex; align-items: center; gap: 10px; }
.pstat .p-name { font-weight: 700; }
.pstat .p-vals { margin-left: auto; text-align: right; font-size: 12px; color: var(--ink-soft); }
.pstat .p-vals b { color: var(--ink); font-size: 13px; }

/* ---------- 폼 / 모달 / 시트 ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(50, 40, 28, .45); z-index: 60; overscroll-behavior: contain;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
  animation: slideup .22s ease-out;
}
@keyframes slideup { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 4px 0 14px; font-size: 18px; }
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea {
  width: 100%; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: #fff; font-size: 16px; color: var(--ink); padding: 0 12px; min-height: 52px;
  font-family: inherit; -webkit-appearance: none; appearance: none;
}
.field textarea { padding: 12px; min-height: 88px; resize: vertical; }
.field .req { color: var(--danger); }
.dir-toggle { display: flex; gap: 8px; }
.dir-toggle button {
  flex: 1; border: 1px solid var(--line); background: var(--surface2); border-radius: var(--radius-sm);
  min-height: 52px; font-size: 15px; font-weight: 700; color: var(--ink-soft); cursor: pointer;
}
.dir-toggle button.on-received { background: var(--received); border-color: var(--received); color: #fff; }
.dir-toggle button.on-given { background: var(--given); border-color: var(--given); color: #fff; }
.dir-toggle button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.photo-preview { display: flex; gap: 10px; align-items: center; }
.photo-preview img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); }
.btn-row { display: flex; gap: 10px; margin-top: 18px; }
.btn {
  flex: 1; border: 0; border-radius: var(--radius); min-height: 54px;
  font-size: 16px; font-weight: 800; cursor: pointer;
}
.btn.primary { background: var(--primary); color: #fff; }
.btn.ghost { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); flex: .6; }
.btn.danger-outline {
  width: 100%; background: transparent; border: 0; color: var(--danger);
  font-size: 15px; font-weight: 700; min-height: 52px; cursor: pointer; margin-top: 14px;
}
.opt-list button {
  display: block; width: 100%; border: 0; background: transparent; text-align: left;
  font-size: 16px; padding: 16px 8px; cursor: pointer; color: var(--ink);
  border-bottom: 1px solid var(--line-soft); min-height: 56px;
}
.opt-list button:last-child { border-bottom: 0; }
.opt-list button.on { font-weight: 800; color: var(--primary); }
.confirm-box { text-align: center; padding: 8px 0; }
.confirm-box p { font-size: 15px; margin: 6px 0 18px; }

/* ---------- 토스트 ---------- */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
  background: var(--ink); color: #fff; font-size: 14px; padding: 12px 20px;
  border-radius: 999px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 80;
  max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 481px) {
  #views { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}

/* ---------- 상황 필터 칩 ---------- */
.occ-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: -4px 0 12px; }
.occ-chips:empty { display: none; }
.filter-chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  border-radius: 999px; padding: 0 14px; min-height: 38px; font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.filter-chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ---------- 데이터 관리 ---------- */
.data-box {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
}
.data-btn {
  display: block; width: 100%; text-align: center;
  border: 1px solid var(--line); background: var(--surface2); color: var(--ink);
  border-radius: var(--radius-sm); min-height: 50px; line-height: 50px;
  font-size: 14px; font-weight: 700; cursor: pointer; padding: 0 12px;
}
.data-note { font-size: 12px; color: var(--ink-faint); margin: 4px 2px 0; }

/* ---------- 설정: 언어 ---------- */
.lang-label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.lang-label.gap { margin-top: 16px; }
.lang-row { display: flex; gap: 8px; flex-wrap: wrap; }
.lang-row button {
  flex: 1; min-width: 70px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink-soft);
  border-radius: 999px; min-height: 44px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.lang-row button.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }

/* ---------- 폼: 여러 명 선택 칩 / 기분 ---------- */
.check-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.check-chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface2); color: var(--ink-soft);
  border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.check-chip input { accent-color: var(--primary); margin: 0; }
.check-chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.field-hint { font-size: 12px; color: var(--ink-faint); margin: 6px 0 0; }
.mood-row { display: flex; gap: 8px; flex-wrap: wrap; }
.mood-row button {
  border: 1px solid var(--line); background: var(--surface2); border-radius: 999px;
  min-height: 44px; padding: 0 14px; font-size: 18px; cursor: pointer; color: var(--ink-soft);
}
.mood-row button.txt { font-size: 13px; font-weight: 700; }
.mood-row button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.gift-name .mood { font-size: 14px; }
.check-line { display: flex !important; align-items: center; gap: 8px; font-size: 14px !important; color: var(--ink) !important; cursor: pointer; }
.check-line input { width: 20px; height: 20px; accent-color: var(--primary); }

/* ---------- 추천 탭 ---------- */
.rec-notice {
  background: var(--surface2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px;
}
#recChips { margin-top: 0; }
.rec-card {
  display: flex; gap: 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px; box-shadow: var(--shadow); cursor: pointer; margin-bottom: 10px;
}
.rec-thumb {
  width: 72px; height: 72px; border-radius: var(--radius-sm); flex: none;
  background: var(--surface2); border: 1px solid var(--line-soft);
  object-fit: cover;
}
.rec-thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 26px; }
.rec-info { flex: 1; min-width: 0; }
.rec-title {
  font-weight: 700; font-size: 15px; margin-bottom: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.rec-desc {
  font-size: 13px; color: var(--ink-soft); margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rec-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.rec-price { font-weight: 700; font-size: 15px; }
.src-badge { margin-left: auto; }

</style>
</head>
<body>
<div id="app">

  <main id="views">
    <nav id="subTabs" aria-label="기록 하위 탭">
      <button data-sub="records" class="on" data-i18n="subList">목록</button>
      <button data-sub="calendar" data-i18n="subCalendar">캘린더</button>
      <button data-sub="people" data-i18n="subPeople">사람</button>
      <button data-sub="anniv" data-i18n="subAnniv">기념일</button>
      <button data-sub="stats" data-i18n="settings">설정</button>
    </nav>
    <!-- 기록 탭 -->
    <section class="view active" id="view-records">
      <header class="view-head"><h1 data-i18n="tabRecords">기록</h1></header>
      <div class="searchbar">

const LANG_CUR = { ko: 'KRW', en: 'USD', zh: 'CNY', ja: 'JPY' };
const CURS = ['KRW', 'USD', 'CNY', 'JPY'];
let cur = store.load('appCurrency', null);
if (CURS.indexOf(cur) < 0) cur = LANG_CUR[lang] || 'KRW';
function setCurrency(code) {
  if (CURS.indexOf(code) < 0) return;
  cur = code;
  store.save('appCurrency', code);
  $$('#curRow button').forEach(b => b.classList.toggle('on', b.dataset.cur === cur));
  render();
}
const t = (k, vars) => {
  let s = (STR[lang] && STR[lang][k]) || STR.ko[k] || k;

  return s;
};
function fmtMonthYear(y, m) {
  if (lang === 'en') return MONTHS_EN[m - 1] + ' ' + y;
  if (lang === 'zh') return y + '年' + m + '月';
  if (lang === 'ja') return y + '年' + m + '月';
  return y + '년 ' + m + '월';
}
function fmtDateFull(y, m, d) {
  if (lang === 'en') return MONTHS_EN[m - 1] + ' ' + d + ', ' + y;
  if (lang === 'zh') return y + '年' + m + '月' + d + '日';
  if (lang === 'ja') return y + '年' + m + '月' + d + '日';
  return y + '년 ' + m + '월 ' + d + '일';
}
function monthOptLabel(m) {

/* ================= 네이티브 브리지 / 파일 저장 =================
   Android WebView에서는 Blob 다운로드가 동작하지 않으므로
   AndroidBridge.saveTextFile(네이티브 Downloads 저장)을 우선 사용하고,
   브리지가 없으면(브라우저 미리보기 등) Blob 다운로드로 폴백한다. */
function hasBridge(method) {
  try { return !!(window.AndroidBridge && typeof window.AndroidBridge[method] === 'function'); }
  catch (e) { return false; }
}
function saveTextFile(fileName, content, mime) {
  if (hasBridge('saveTextFile')) {
    try { window.AndroidBridge.saveTextFile(fileName, content); return true; } catch (e) { /* 폴백 */ }
  }
  try {
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { return false; }
}

function fileStamp() {

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV() {
  const head = CSV_HEADS[lang] || CSV_HEADS.ko;
  const rows = gifts.slice()
    .sort((a, b) => a.giftDate.localeCompare(b.giftDate))
    .map(g => [

      g.occasion || '', g.mood || '', g.notes || ''
    ].map(csvCell).join(','));

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data = null;
    try { data = JSON.parse(String(reader.result)); } catch (e) { data = null; }
    if (!data || !Array.isArray(data.gifts) || !Array.isArray(data.personReminders) ||
        !Array.isArray(data.giftIdeas)) {
      toast(t('badBackup'));
      return;
    }
    confirmDialog(t('restoreQ'), () => {
      gifts = data.gifts;
      reminders = data.personReminders;
      ideas = data.giftIdeas;
      persist();
      syncRemindersToNative();
      peopleState.sel = null;
      $('#personDetail').hidden = true;
      render();
      toast(t('restored'));
    }, t('restore'));
  };
  reader.onerror = () => toast(t('fileUnreadable'));
  reader.readAsText(file);
}

/* ================= 기념일 알림 네이티브 동기화 =================
   각 알람의 다음 도래일을 계산해 네이티브(AlarmManager)에 전달한다.
   브리지가 없으면 조용히 건너뛴다. */
function syncRemindersToNative() {
  try {
    if (!hasBridge('syncReminders')) return;
    const items = [];
    reminders.forEach(r => {
      const n = nextOccurrence(r);
      if (!n) return;
      items.push({
        personName: r.personName,
        note: r.note || '',
        dateISO: fmtYMD(n.date.y, n.date.m, n.date.d),
        preNotify: r.preNotify !== false
      });
    });
    window.AndroidBridge.syncReminders(JSON.stringify(items));
  } catch (e) { /* 동기화 실패는 앱 동작에 영향 없음 */ }
}

/* ---- 스와이프 삭제 ---- */
let swipeState = null;
function closeAllSwipes(except) {
  $$('.swipe-inner.open').forEach(el => {
    if (el !== except) { el.style.transition = 'transform .2s'; el.style.transform = ''; el.classList.remove('open'); }
  });
}
function bindSwipe(container) {
  container.addEventListener('touchstart', e => {
    const inner = e.target.closest('.swipe-inner');
    closeAllSwipes(inner || undefined);
    if (!inner) { swipeState = null; return; }
    const t = e.touches[0];
    swipeState = { inner, x0: t.clientX, y0: t.clientY, base: inner.classList.contains('open') ? -88 : 0, dx: 0, active: false };
  }, { passive: true });
  container.addEventListener('touchmove', e => {
    if (!swipeState || !swipeState.inner) return;
    const t = e.touches[0];
    const dx = t.clientX - swipeState.x0, dy = t.clientY - swipeState.y0;
    if (!swipeState.active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swipeState = null; return; }
      if (Math.abs(dx) < 8) return;
      swipeState.active = true;
    }
    swipeState.dx = dx;
    let x = swipeState.base + dx;
    x = Math.max(-88, Math.min(0, x));
    swipeState.inner.style.transition = 'none';
    swipeState.inner.style.transform = 'translateX(' + x + 'px)';
  }, { passive: true });
  container.addEventListener('touchend', () => {
    if (!swipeState || !swipeState.inner) return;
    const s = swipeState; swipeState = null;
    if (!s.active) return;
    s.inner.dataset.swiped = '1';
    setTimeout(() => { delete s.inner.dataset.swiped; }, 50);
    let x = s.base + s.dx;
    const open = s.base === 0 ? x < -44 : x < -64;
    s.inner.style.transition = 'transform .2s';
    s.inner.style.transform = open ? 'translateX(-88px)' : '';
    s.inner.classList.toggle('open', open);
  });
  container.addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) {
      const id = del.dataset.del;
      confirmDialog(t('delGiftQ'), () => deleteGift(id));
      return;
    }
    const card = e.target.closest('[data-open]');
    if (card) {
      const inner = card.closest('.swipe-inner');
      if (inner && inner.dataset.swiped) return;
      if (inner && inner.classList.contains('open')) { closeAllSwipes(); return; }
      openGiftForm(card.dataset.open);
    }
  });
}

const MOODS = ['😊', '🥰', '😆', '🙏', '🥲'];
let formPhoto = null;

function processPhoto(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1600;
      let w = img.width, h = img.height;
      if (Math.max(w, h) > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

      price: Math.round(Number(priceRaw)),
      notes: $('#fNotes', ov).value.trim(),
      photoDataUrl: formPhoto
    };

const calState = { y: 0, m: 0, sel: null };
function initCalendar() { const t = todayLocal(); calState.y = t.y; calState.m = t.m; calState.sel = fmtYMD(t.y, t.m, t.d); }

function renderCalendar() {
  const { y, m } = calState;
  $('#calTitle').textContent = fmtMonthYear(y, m);
  const first = new Date(y, m - 1, 1).getDay();
  const dim = daysInMonth(y, m);
  const byDate = {};
  gifts.forEach(g => {
    (byDate[g.giftDate] = byDate[g.giftDate] || []).push(g);
  });
  const t = todayLocal(), todayS = fmtYMD(t.y, t.m, t.d);
  let html = (DOWS[lang] || DOWS.ko).map(d => '<div class="cal-dow">' + d + '</div>').join('');
  for (let i = 0; i < first; i++) html += '<div></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = fmtYMD(y, m, d);
    const gs = byDate[ds] || [];
    const dots = (gs.some(g => g.direction === 'given') ? '<span class="dot given"></span>' : '') +
                 (gs.some(g => g.direction === 'received') ? '<span class="dot received"></span>' : '');
    const cls = 'cal-day' + (ds === todayS ? ' today' : '') + (ds === calState.sel ? ' sel' : '');
    html += '<button class="' + cls + '" data-day="' + ds + '">' + d + '<span class="cal-dots">' + dots + '</span></button>';
  }
  $('#calGrid').innerHTML = html;
  renderCalDayList();

function allPeople() {
  const map = {};

/* ================= 추천 탭 =================
   추천 상품은 앱에 하드코딩하지 않고 원격 JSON에서 불러온다.
   링크 추가·수정은 recommend-links.json만 고치면 앱 업데이트 없이 반영된다.
   로딩 순서: fetch 성공 시 렌더 + 캐시 저장 → 실패 시 캐시 사용 → 캐시도 없으면 재시도 안내 */
const RECOMMEND_URL = 'https://in-yeong.github.io/gift-tracker-privacy/recommend-links.json';
const recmdState = { items: null, loaded: false, loading: false, error: false, cat: '' };
const SOURCE_LABELS = { coupang: 'srcCoupang', naver: 'srcNaver', etc: 'srcEtc' };

function activeRecommendItems() {
  if (!recmdState.items) return [];
  return recmdState.items
    .filter(it => it && it.active !== false)
    .slice()
    .sort((a, b) => (Number(a.sort) || 0) - (Number(b.sort) || 0));
}
function renderRecommendChips(list) {
  const box = $('#recChips');
  if (!box) return;
  const cats = [];
  list.forEach(it => {
    const c = (it.category || '').trim();
    if (c && !cats.includes(c)) cats.push(c);
  });
  if (recmdState.cat && !cats.includes(recmdState.cat)) recmdState.cat = '';
  if (!cats.length) { box.innerHTML = ''; return; }
  box.innerHTML =
    '<button type="button" class="filter-chip' + (recmdState.cat === '' ? ' on' : '') + '" data-rcat="">' + esc(t('all')) + '</button>' +
    cats.map(c => '<button type="button" class="filter-chip' + (recmdState.cat === c ? ' on' : '') + '" data-rcat="' + esc(c) + '">' + esc(c) + '</button>').join('');
}
function recommendCardHTML(it) {
  const img = it.imageUrl
    ? '<img class="rec-thumb" src="' + esc(it.imageUrl) + '" alt="" loading="lazy" onerror="this.outerHTML=\'&lt;div class=&quot;rec-thumb placeholder&quot;&gt;🎁&lt;/div&gt;\'">'
    : '<div class="rec-thumb placeholder">🎁</div>';
  const label = t(SOURCE_LABELS[it.source] || SOURCE_LABELS.etc);
  return '<div class="rec-card" data-rec-url="' + esc(it.url || '') + '" role="button" tabindex="0">' +
    img +
    '<div class="rec-info">' +
    '<div class="rec-title">' + esc(it.title || '') + '</div>' +
    (it.desc ? '<div class="rec-desc">' + esc(it.desc) + '</div>' : '') +
    '<div class="rec-row">' +
    (Number(it.price) > 0 ? '<span class="rec-price">' + fmtPrice(it.price) + '</span>' : '') +
    '<span class="badge src-badge">' + esc(label) + '</span>' +
    '</div></div></div>';
}
function renderRecommend() {
  const box = $('#recommendList');
  if (!box) return;
  if (!recmdState.loaded && !recmdState.error) {
    renderRecommendChips([]);
    box.innerHTML = '<div class="empty">' + esc(t('recLoading')) + '</div>';
    loadRecommend();
    return;
  }
  if (recmdState.error) {
    renderRecommendChips([]);
    box.innerHTML = '<div class="empty">' + t('recError') + '</div>' +
      '<div class="more-wrap"><button type="button" class="more-btn" id="recRetryBtn">' + esc(t('retry')) + '</button></div>';
    const rb = $('#recRetryBtn');
    if (rb) rb.onclick = () => { recmdState.error = false; renderRecommend(); };
    return;
  }
  const list = activeRecommendItems();
  renderRecommendChips(list);
  const visible = recmdState.cat ? list.filter(it => (it.category || '').trim() === recmdState.cat) : list;
  box.innerHTML = visible.length
    ? visible.map(recommendCardHTML).join('')
    : '<div class="empty">' + t('recEmpty') + '</div>';
}
function loadRecommend() {
  if (recmdState.loading) return;
  recmdState.loading = true;
  const done = items => {
    recmdState.loading = false;
    recmdState.loaded = true;
    recmdState.error = false;
    recmdState.items = items;
    if (currentView === 'recommend') renderRecommend();
  };
  const fail = () => {
    recmdState.loading = false;
    let cached = store.load('recommendCache', null);
    if (cached && !Array.isArray(cached) && Array.isArray(cached.items)) cached = cached.items;
    if (Array.isArray(cached)) { done(cached); return; }
    recmdState.error = true;
    if (currentView === 'recommend') renderRecommend();
  };
  if (typeof fetch !== 'function') { fail(); return; }
  fetch(RECOMMEND_URL, { cache: 'no-store' })
    .then(res => { if (!res.ok) throw new Error('http ' + res.status); return res.json(); })
    .then(data => {
      const items = data && Array.isArray(data.items) ? data.items : null;
      if (!items) throw new Error('bad schema');
      store.save('recommendCache', data);
      done(items);
    })
    .catch(fail);
}
function openRecommendLink(url) {
  if (!url) return;
  if (hasBridge('openExternal')) {
    try { window.AndroidBridge.openExternal(url); return; } catch (e) { /* 폴백 */ }
  }
  try { window.open(url, '_blank'); } catch (e) { /* 무시 */ }
}

function render() {
  if (currentView === 'records') renderRecords();
  else if (currentView === 'calendar') { renderCalendar(); renderStats(); }
  else if (currentView === 'people') { if (!peopleState.sel) { $('#personDetail').hidden = true; } renderPeople(); }
  else if (currentView === 'anniv') renderAnniv();
  else if (currentView === 'recommend') renderRecommend();
  else if (currentView === 'stats') renderStats();
}

  $('#searchInput').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { recState.q = e.target.value; recState.shown = 20; renderRecords(); }, 200);
  });
  $$('#dirFilter button').forEach(b => b.onclick = () => {
    recState.dir = b.dataset.dir; recState.shown = 20;
    $$('#dirFilter button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    renderRecords();
  });
  $('#occChips').addEventListener('click', e => {
    const chip = e.target.closest('[data-occ]');
    if (!chip) return;
    recState.occ = chip.dataset.occ || '';
    recState.shown = 20;
    renderRecords();
  });
  $('#sortBtn').onclick = () => openSortSheet(recState.sort,
    Object.keys(SORT_LABELS).map(v => ({ v, label: t(SORT_LABELS[v]) })),
    v => { recState.sort = v; renderRecords(); });
  $('#moreBtn').onclick = () => { recState.shown += 20; renderRecords(); };

  /* 캘린더 탭 */
  const calMove = dir => {
    calState.m += dir;
    if (calState.m < 1) { calState.m = 12; calState.y--; }
    if (calState.m > 12) { calState.m = 1; calState.y++; }
    const td = todayLocal();
    calState.sel = (calState.y === td.y && calState.m === td.m) ? fmtYMD(td.y, td.m, td.d) : fmtYMD(calState.y, calState.m, 1);
    render();
  };
  $('#calPrev').onclick = () => calMove(-1);
  $('#calNext').onclick = () => calMove(1);
  const arb = $('#annivRemAdd');
  if (arb) arb.onclick = () => openReminderForm(null, null);
  $('#calGrid').addEventListener('click', e => {
    const d = e.target.closest('[data-day]');
    if (d) { calState.sel = d.dataset.day; renderCalendar(); }
  });
  /* 사람 탭 */
  let pTimer = null;
  $('#peopleSearch').addEventListener('input', e => {
    clearTimeout(pTimer);
    pTimer = setTimeout(() => { peopleState.q = e.target.value; peopleState.shown = 20; peopleState.sel = null; $('#personDetail').hidden = true; renderPeople(); }, 200);
  });
  $('#peopleSortBtn').onclick = () => openSortSheet(peopleState.sort,
    Object.keys(PEOPLE_SORTS).map(v => ({ v, label: t(PEOPLE_SORTS[v]) })),
    v => { peopleState.sort = v; renderPeople(); });
  $('#peopleMoreBtn').onclick = () => { peopleState.shown += 20; renderPeople(); };
  $('#peopleList').addEventListener('click', e => {
    const r = e.target.closest('[data-person]');
    if (r) { peopleState.sel = r.dataset.person; renderPeople(); window.scrollTo(0, 0); }
  });

  /* 추천 탭 */
  $('#recChips').addEventListener('click', e => {
    const chip = e.target.closest('[data-rcat]');
    if (!chip) return;
    recmdState.cat = chip.dataset.rcat || '';
    renderRecommend();
  });
  $('#recommendList').addEventListener('click', e => {
    const card = e.target.closest('[data-rec-url]');
    if (card) openRecommendLink(card.dataset.recUrl);
  });

  /* 통계 탭 — 데이터 관리 */
  $('#exportJsonBtn').onclick = exportJSON;
  $('#exportCsvBtn').onclick = exportCSV;
  $('#importFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) importJSON(f);
    e.target.value = '';
  });

  /* 설정 — 언어 */
  $$('#langRow button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  $$('#curRow button').forEach(b => b.onclick = () => setCurrency(b.dataset.cur));
}

function init() {
  initCalendar();
  applyI18n();
  if (hasBridge('setLang')) { try { window.AndroidBridge.setLang(lang); } catch (e) { /* 무시 */ } }
  bindSwipe($('#recordsList'));
  bindSwipe($('#calDayList'));
  bindSwipe($('#personDetail'));
  bindEvents();
  render();
  syncRemindersToNative();
}
document.addEventListener('DOMContentLoaded', init);

})();

</script>
</body>
</html>
